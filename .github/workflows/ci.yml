name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends maxima fricas
      - run: pip install -e '.[dev]'
      - name: Backend smoke test
        run: |
          maxima --version || true
          fricas --version < /dev/null | head -3 || true
          python - <<'PY'
          import importlib.util, sys, pathlib
          for name, expr in (("maxima", "integrate(1/(1+x^2), x)"), ("fricas", "integrate(1/(1+x^2), x)")):
              spec = importlib.util.spec_from_file_location(f"quire_module_{name}", pathlib.Path("modules") / name / "module.py")
              m = importlib.util.module_from_spec(spec); sys.modules[spec.name] = m; spec.loader.exec_module(m)
              print(name, "binary:", getattr(m, name.upper(), None))
              try:
                  print(name, "run:", m._run(expr) if name == "fricas" else m._run(f"{expr};"))
              except Exception as exc:
                  print(name, "error:", type(exc).__name__, exc)
          PY
      - run: python -m pytest -q tests
