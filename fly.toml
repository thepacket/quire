# fly.io configuration for Quire.
#   fly launch --copy-config --no-deploy     (first time: creates the app, then set the region/name below)
#   fly volumes create quire_data --size 1   (worksheets persist here)
#   fly secrets set QUIRE_PASSWORD=...       (recommended: the evaluator would otherwise be public)
#   fly deploy
app = "quire"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  QUIRE_HOST = "0.0.0.0"
  QUIRE_WORKSHEETS = "/data/worksheets"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[mounts]
  source = "quire_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
