# fly.toml app configuration file generated for quire-calc on 2026-09-01T23:09:55-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quire-calc'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  QUIRE_HOST = '0.0.0.0'
  QUIRE_WORKSHEETS = '/data/worksheets'

# Worksheets live in the Tigris bucket (`fly storage create`, which set BUCKET_NAME and the AWS_*
# secrets): the folder under QUIRE_WORKSHEETS is a mirror rebuilt at startup, so no volume is
# mounted and the app can run on any host. To go back to a volume, add:
#   [[mounts]]
#     source = 'quire_data'
#     destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 4
  memory_mb = 1024
