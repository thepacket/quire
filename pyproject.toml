[project]
name = "quire"
version = "0.1.0"
description = "A reactive, unit-aware math worksheet. Symbolic and numeric math with plotting, no programming required."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andre Paquette" }]
requires-python = ">=3.11"
keywords = ["math", "worksheet", "sympy", "units", "plotting", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = ["sympy>=1.13", "numpy>=1.26", "scipy>=1.12", "CoolProp>=6.6", "periodictable>=1.7"]
[project.urls]
Homepage = "https://github.com/thepacket/quire"
Repository = "https://github.com/thepacket/quire"
Issues = "https://github.com/thepacket/quire/issues"
Discussions = "https://github.com/thepacket/quire/discussions"

[project.optional-dependencies]
dev = ["pytest"]
desktop = ["pywebview>=5"]

[project.scripts]
quire = "quire.__main__:main"
quire-desktop = "quire.desktop:main"

[tool.setuptools.packages.find]
include = ["quire*"]

[tool.setuptools.package-data]
quire = ["ui/*", "ui/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
